<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-dark: #0B1021;
            --card-bg: #131B2F;
            --neon-cyan: #00F0FF;
            --neon-green: #10B981;
            --neon-red: #FF4D4D;
            --neon-orange: #F59E0B;
            --neon-purple: #A855F7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            width: 300px; margin: 0; padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: var(--text-main); text-align: center;
        }

        .header { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 240, 255, 0.1); }
        .logo { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--neon-cyan); margin-right: 12px; }
        .title { font-size: 15px; font-weight: 800; color: var(--neon-cyan); margin: 0; text-transform: uppercase; }

        .status-container {
            background: linear-gradient(145deg, var(--card-bg) 0%, #060913 100%);
            border: 1px solid #1e293b; border-radius: 12px; padding: 20px 15px; margin-bottom: 20px; transition: all 0.3s ease;
        }

        .status-icon { font-size: 38px; margin-bottom: 10px; display: block; }
        .status-title { font-size: 16px; font-weight: bold; margin: 0 0 5px 0; }
        .status-desc { font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.4; }

        .btn-scan {
            width: 100%; background-color: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
            padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; text-transform: uppercase; transition: all 0.3s ease;
        }
        .btn-scan:hover { background-color: rgba(0, 240, 255, 0.1); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        /* ESTILOS DINÁMICOS */
        .estado-vigilando { border-color: var(--neon-cyan) !important; animation: pulse-cyan 2s infinite; }
        .estado-vigilando .status-title { color: var(--neon-cyan); }

        .estado-seguro { border-color: var(--neon-green) !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); }
        .estado-seguro .status-title { color: var(--neon-green); }

        .estado-analizando { border-color: var(--neon-purple) !important; animation: pulse-purple 1.5s infinite; }
        .estado-analizando .status-title { color: var(--neon-purple); }

        .estado-precaucion { border-color: var(--neon-orange) !important; box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
        .estado-precaucion .status-title { color: var(--neon-orange); }

        .estado-peligro { border-color: var(--neon-red) !important; box-shadow: 0 0 15px rgba(255, 77, 77, 0.2); }
        .estado-peligro .status-title { color: var(--neon-red); }

        .estado-error { border-color: #64748b !important; }
        .estado-error .status-title { color: #ef4444; }

        @keyframes pulse-cyan { 0%, 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); } 50% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); } }
        @keyframes pulse-purple { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } 50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); } }
    </style>
</head>
<body>
<div class="header">
    <img src="logo.png" alt="Logo" class="logo">
    <h1 class="title">Phishing AI</h1>
</div>

<div id="statusBox" class="status-container">
    <span id="statusIcon" class="status-icon">🔄</span>
    <h2 id="statusTitle" class="status-title">Iniciando...</h2>
    <p id="statusDesc" class="status-desc">Conectando con el escáner de la página.</p>
</div>

<button id="btnForceScan" class="btn-scan">Re-evaluar Página</button>
<script src="popup.js"></script>
</body>
</html>
